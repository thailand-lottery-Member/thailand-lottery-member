<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Official Membership</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px #cccccc;
    }
    h1 {
      text-align: center;
      color: #087443;
    }
    input, textarea, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      background: #087443;
      color: white;
      border: none;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Membership Application</h1>
    <p>Membership Registration Form</p>
    <form>
      <label>Full Name</label>
      <input type="text" placeholder="Enter your full name" required>

      <label>Passport Number</label>
      <input type="text" placeholder="Passport number" required>

      <label>Email Address</label>
      <input type="email" placeholder="Enter your email" required>

      <label>Address</label>
      <textarea placeholder="Enter your address" required></textarea>

      <label>Upload Photo</label>
      <input type="file" accept="image/*">

      <button type="submit">Submit Application</button>
    </form>
  </div>
</body>
</html>
